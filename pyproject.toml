[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wav-compare"
version = "0.0.0"
description = "A streaming, multichannel WAV comparison and audio analysis workbench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "sunging"}]
dependencies = [
  "numpy>=2.1,<3", "soundfile>=0.13,<1", "scipy>=1.14,<2",
  "soxr>=0.5,<2", "PySide6>=6.8,<7", "pyqtgraph>=0.13.7,<1",
]

[project.urls]
Homepage = "https://github.com/sunging/wav_compare"
Issues = "https://github.com/sunging/wav_compare/issues"

[project.scripts]
wav-compare = "wav_compare.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1", "psutil>=6,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/wav_compare"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
